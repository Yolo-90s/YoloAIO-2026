<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="YoloAIO app icon">
  <defs>
    <radialGradient id="bg" cx="20%" cy="18%" r="90%">
      <stop offset="0%"   stop-color="#1F2B36"/>
      <stop offset="50%"  stop-color="#141C24"/>
      <stop offset="100%" stop-color="#0A1015"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE5EC"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#43C7BB"/>
      <stop offset="100%" stop-color="#1F7570"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <g filter="url(#lift)">
    <path fill="url(#mark)" d="M 250 250 L 392 250 L 460 502 L 460 760 Q 460 800 500 800 L 524 800 Q 564 800 564 760 L 564 502 L 632 250 L 774 250 Q 750 360 512 502 Z"/>
  </g>
  <path d="M 322 866 Q 512 906 702 866"
        stroke="url(#teal)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="512" cy="500" r="9" fill="#E0993E"/>
</svg>
